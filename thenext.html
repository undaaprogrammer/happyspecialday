<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Final Archive</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Helvetica Neue",Arial,sans-serif;
}

body{
  background:#fffafd;
  color:#4b4350;

  transition:
    background 3s ease,
    color 3s ease;
}


/* =========================
   OPENING
========================= */

.intro{
  position:fixed;
  inset:0;

  background:#fff;

  z-index:50;

  display:flex;
  justify-content:center;
  align-items:center;

  animation:introFade 2.4s ease forwards;
}

.intro span{
  font-size:9px;
  letter-spacing:4px;
  text-transform:uppercase;

  color:#b08fa1;

  opacity:0;

  animation:introText 1s ease .4s forwards;
}

@keyframes introFade{

  0%,70%{
    opacity:1;
  }

  100%{
    opacity:0;
    visibility:hidden;
  }

}

@keyframes introText{

  to{
    opacity:.7;
  }

}


/* =========================
   BACKGROUND
========================= */

.page{
  position:relative;

  width:100%;
  height:100%;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:25px;
}

.glow{
  position:absolute;

  width:320px;
  height:320px;

  border-radius:50%;

  background:#f4b8cb;

  filter:blur(90px);

  opacity:.42;

  transition:
    background 3s ease,
    opacity 3s ease,
    transform 3s ease;
}

.glow.one{
  top:-130px;
  left:-120px;
}

.glow.two{
  right:-130px;
  bottom:-130px;

  background:#d9c8ef;
}


/* =========================
   CONTENT
========================= */

.archive{
  position:relative;

  width:min(430px,100%);

  text-align:center;

  z-index:5;
}

.label{
  font-size:8px;
  letter-spacing:4px;
  text-transform:uppercase;

  color:#b08fa1;

  opacity:0;

  animation:
    appear .8s ease 2.1s forwards;
}

.title{
  margin-top:13px;

  font-size:25px;
  font-weight:300;

  letter-spacing:-.6px;

  color:#514752;

  opacity:0;

  animation:
    appear .8s ease 2.5s forwards;
}

.subtitle{
  max-width:300px;

  margin:10px auto 0;

  font-size:10px;
  line-height:1.8;

  color:#968b98;

  opacity:0;

  animation:
    appear .8s ease 2.9s forwards;
}

@keyframes appear{

  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* =========================
   PHOTO ARCHIVE
========================= */

.photo-area{
  position:relative;

  width:100%;
  height:300px;

  margin-top:22px;
}


/* =========================
   PHOTO CARD
========================= */

.photo{
  position:absolute;

  width:145px;
  height:185px;

  left:50%;
  top:50%;

  padding:7px;

  background:#fff;

  border-radius:5px;

  box-shadow:
    0 16px 35px rgba(173,111,136,.16);

  opacity:0;

  transform:
    translate(-50%,-50%)
    scale(.7)
    rotate(0deg);

  transition:
    transform 1.5s cubic-bezier(.2,.8,.2,1),
    opacity 1.2s ease,
    box-shadow 1s ease;
}

.photo img{
  width:100%;
  height:100%;

  object-fit:cover;

  border-radius:2px;

  display:block;
}


/* =========================
   PHOTO ENTRANCE
========================= */

.photo:nth-child(1){

  animation:
    photoOne 1.4s cubic-bezier(.2,.8,.2,1) 3.3s forwards,
    floatOne 5s ease-in-out 5s infinite;

}

.photo:nth-child(2){

  animation:
    photoTwo 1.4s cubic-bezier(.2,.8,.2,1) 3.9s forwards,
    floatTwo 5.5s ease-in-out 5.6s infinite;

}

.photo:nth-child(3){

  animation:
    photoThree 1.4s cubic-bezier(.2,.8,.2,1) 4.5s forwards,
    floatThree 4.8s ease-in-out 6.2s infinite;

}

.photo:nth-child(4){

  animation:
    photoFour 1.4s cubic-bezier(.2,.8,.2,1) 5.1s forwards,
    floatFour 5.2s ease-in-out 6.8s infinite;

}


/* =========================
   ENTRANCE POSITIONS
========================= */

@keyframes photoOne{

  from{
    opacity:0;

    transform:
      translate(-50%,-50%)
      translate(-100px,60px)
      scale(.65)
      rotate(-18deg);
  }

  to{
    opacity:1;

    transform:
      translate(-50%,-50%)
      translate(-105px,-8px)
      scale(.9)
      rotate(-9deg);
  }

}

@keyframes photoTwo{

  from{
    opacity:0;

    transform:
      translate(-50%,-50%)
      translate(100px,70px)
      scale(.65)
      rotate(17deg);
  }

  to{
    opacity:1;

    transform:
      translate(-50%,-50%)
      translate(95px,5px)
      scale(.92)
      rotate(8deg);
  }

}

@keyframes photoThree{

  from{
    opacity:0;

    transform:
      translate(-50%,-50%)
      translate(-120px,-90px)
      scale(.65)
      rotate(20deg);
  }

  to{
    opacity:1;

    transform:
      translate(-50%,-50%)
      translate(-42px,-62px)
      scale(.88)
      rotate(6deg);
  }

}

@keyframes photoFour{

  from{
    opacity:0;

    transform:
      translate(-50%,-50%)
      translate(120px,-90px)
      scale(.65)
      rotate(-20deg);
  }

  to{
    opacity:1;

    transform:
      translate(-50%,-50%)
      translate(45px,-60px)
      scale(.9)
      rotate(-7deg);
  }

}


/* =========================
   FLOATING MOVEMENT
========================= */

@keyframes floatOne{

  0%,100%{
    transform:
      translate(-50%,-50%)
      translate(-105px,-8px)
      rotate(-9deg);
  }

  50%{
    transform:
      translate(-50%,-50%)
      translate(-105px,-16px)
      rotate(-6deg);
  }

}

@keyframes floatTwo{

  0%,100%{
    transform:
      translate(-50%,-50%)
      translate(95px,5px)
      rotate(8deg);
  }

  50%{
    transform:
      translate(-50%,-50%)
      translate(95px,-7px)
      rotate(11deg);
  }

}

@keyframes floatThree{

  0%,100%{
    transform:
      translate(-50%,-50%)
      translate(-42px,-62px)
      rotate(6deg);
  }

  50%{
    transform:
      translate(-50%,-50%)
      translate(-42px,-70px)
      rotate(3deg);
  }

}

@keyframes floatFour{

  0%,100%{
    transform:
      translate(-50%,-50%)
      translate(45px,-60px)
      rotate(-7deg);
  }

  50%{
    transform:
      translate(-50%,-50%)
      translate(45px,-69px)
      rotate(-10deg);
  }

}


/* =========================
   ARCHIVE STATUS
========================= */

.status{
  position:absolute;

  bottom:0;
  left:0;

  width:100%;

  font-size:8px;

  letter-spacing:3px;

  text-transform:uppercase;

  color:#b08fa1;

  opacity:0;

  animation:
    appear .8s ease 6.8s forwards,
    pulse 2s ease 7.5s infinite;
}

@keyframes pulse{

  50%{
    opacity:.3;
  }

}


/* =========================
   PINK TRANSITION
========================= */

body.dark{
  background:#fff1f6;
  color:#554852;
}

body.dark .glow{
  background:#efa9c0;

  opacity:.32;

  transform:scale(1.5);
}

body.dark .glow.two{
  background:#c9b9e8;

  opacity:.22;
}

body.dark .label,
body.dark .status{
  color:#a77d90;
}

body.dark .subtitle{
  color:#9b8d96;
}

body.dark .photo{
  box-shadow:
    0 18px 45px rgba(163,102,126,.18);
}


/* =========================
   FINAL SCREEN
========================= */

.end{
  position:fixed;

  inset:0;

  z-index:100;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 45%,
      #f9dce7 0%,
      #f8e5ed 38%,
      #fff6f9 72%,
      #fffafd 100%
    );

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  opacity:0;
  visibility:hidden;

  transition:
    opacity 2.4s ease,
    visibility 2.4s ease;
}

.end.show{
  opacity:1;
  visibility:visible;
}


/* =========================
   SOFT GLOW
========================= */

.end::before,
.end::after{
  content:"";

  position:absolute;

  width:280px;
  height:280px;

  border-radius:50%;

  filter:blur(80px);

  opacity:.35;

  pointer-events:none;
}

.end::before{
  top:-100px;
  left:-90px;

  background:#f3a8bf;
}

.end::after{
  right:-100px;
  bottom:-100px;

  background:#cbb9e8;
}


/* =========================
   CONFETTI
========================= */

.confetti{
  position:absolute;

  inset:0;

  pointer-events:none;

  z-index:1;
}

.confetti span{

/* =========================
   CONFETTI ANIMATION
========================= */

@keyframes confettiBurst{

  0%{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.3)
      rotate(0deg);
  }

  15%{
    opacity:.9;
  }

  65%{
    opacity:.75;
  }

  100%{
    opacity:.45;

    transform:
      translate(
        calc(-50% + var(--x)),
        calc(-50% + var(--y))
      )
      scale(1)
      rotate(var(--r));
  }

}


/* =========================
   FINAL TEXT
========================= */

.end-small{
  position:relative;

  z-index:5;

  font-size:8px;

  letter-spacing:5px;

  text-transform:uppercase;

  color:#a77d90;

  margin-bottom:20px;

  opacity:0;

  transform:translateY(12px);

  transition:
    opacity 1.4s ease .7s,
    transform 1.4s ease .7s;
}

.end-title{
  position:relative;

  z-index:5;

  font-size:25px;

  font-weight:300;

  letter-spacing:1px;

  color:#5b4651;

  opacity:0;

  transform:scale(.94);

  transition:
    opacity 1.8s ease 1.1s,
    transform 2s cubic-bezier(.2,.8,.2,1) 1.1s;
}

.end-line{
  position:relative;

  z-index:5;

  width:0;

  height:1px;

  margin-top:25px;

  background:#d79caf;

  transition:
    width 1.8s ease 1.8s;
}

.end.show .end-small{
  opacity:1;

  transform:translateY(0);
}

.end.show .end-title{
  opacity:1;

  transform:scale(1);
}

.end.show .end-line{
  width:80px;

<script>

/*
   TIMELINE

   0s
   → opening

   3.3s
   → foto mulai muncul

   6.8s
   → archive selesai

   7.6s
   → background berubah pink pastel

   10.4s
   → final screen muncul

   → confetti mulai berhamburan
*/


setTimeout(() => {

  document.body.classList.add("dark");

}, 7600);


setTimeout(() => {

  document
    .querySelector(".end")
    .classList.add("show");

}, 10400);
